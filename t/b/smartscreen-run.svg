<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="title">
<title id="title">SmartScreen詳細情報画面の例：実行を選択</title>
<rect x="1" y="1" width="678" height="418" rx="12" fill="#403f3c" stroke="#777"/>
<g fill="white" font-family="sans-serif"><text x="26" y="54" font-size="28">Windows によって PC が保護されました</text>
<text x="26" y="105" font-size="17">Microsoft Defender SmartScreen は認識されないアプリの</text><text x="26" y="132" font-size="17">起動を停止しました。</text>
<text x="32" y="194" font-size="21">アプリ: gcal.exe</text><text x="32" y="225" font-size="21">発行元: 不明な発行元</text></g>
<text x="239" y="312" fill="#ffd66b" font-family="sans-serif" font-size="20">② 「実行」を選択</text>
<path d="M443 318v20m-12-15 12 15 12-15" fill="none" stroke="#ffd66b" stroke-width="4"/>
<rect x="382" y="342" width="113" height="56" rx="5" fill="none" stroke="#ffd66b" stroke-width="4"/>
<rect x="390" y="348" width="97" height="44" fill="white"/><text x="418" y="378" fill="black" font-family="sans-serif" font-size="20">実行</text>
<rect x="507" y="348" width="140" height="44" fill="white"/><text x="523" y="378" fill="black" font-family="sans-serif" font-size="20">実行しない</text>
</svg>
